name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          PORTFOLIO_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the branch-based Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          source="$(gh api "$repo/pages" --jq .build_type)"
          [ "$source" = legacy ] || exit 0

          # Branch publishing can otherwise replace the Vite artifact with the source files.
          for attempt in {1..5}; do
            run_id="$(gh api --method GET "$repo/actions/runs" \
              -f head_sha="$GITHUB_SHA" -f event=dynamic \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")][0].id // empty')"
            if [ -n "$run_id" ]; then
              timeout 180 gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 5
              break
            fi
            sleep 4
          done
      - uses: actions/deploy-pages@v4
        id: deployment
